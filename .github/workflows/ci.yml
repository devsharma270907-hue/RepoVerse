name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26 # Active LTS at time of writing — re-check before bumping
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Reproducible installs (blueprint Section 9 — never npm install in CI)
      - name: Install
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Test (in-memory MongoDB)
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Test (jsdom, network mocked)
        run: npm test

      - name: Build
        run: npm run build
